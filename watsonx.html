const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let busy = false;
async function tryUnlock(pass, silent) {
  if (busy || !pass) return; busy = true;
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Unlocking\u2026';
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SALT), iterations:ITERS, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, k, b64(DATA));
    try { localStorage.setItem('li-case-pw', pass); } catch(e) {}
    const view = document.getElementById('view');
    view.srcdoc = new TextDecoder().decode(pt);
    view.style.display = 'block';
    document.getElementById('card').style.display = 'none';
  } catch(e) {
    if (!silent) document.getElementById('err').textContent = "That's not it \u2014 email me for the password.";
  }
  btn.disabled = false; btn.textContent = 'View case study'; busy = false;
}
document.getElementById('go').addEventListener('click', () => tryUnlock(document.getElementById('pw').value, false));
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(e.target.value, false); });
try { const saved = localStorage.getItem('li-case-pw'); if (saved) tryUnlock(saved, true); } catch(e) {}
